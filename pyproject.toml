[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "d3dxSkinManage-Plus"
version = "1.0.0"
description = "一款基于 PySide6 的现代化 3DMigoto Mod 管理器"
readme = "README.md"
license = "LicenseRef-d3dxSkinManage-Plus"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10,<3.15"
authors = [
    {name = "d3dxSkinManage-Plus Team"}
]

dependencies = [
    "windows-capture==2.0.1; sys_platform == 'win32'",
    "PySide6==6.11.1",
    "py7zr>=1.1.0,<2.0.0",
    "rarfile>=4.1",
    "unrar2-cffi>=0.4",
    "watchdog>=6.0.0,<7.0.0",
    "Pillow>=10.0.0",
    "httpx>=0.25.0",
    "pypinyin>=0.52.0",
    "bleach>=6.0.0",
    "tinycss2>=1.2.0",
    "tenacity>=8.0.0",
    "rapidfuzz>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/CHN-HelloWorld/d3dxSkinManage-Plus"
Repository = "https://github.com/CHN-HelloWorld/d3dxSkinManage-Plus"
Issues = "https://github.com/CHN-HelloWorld/d3dxSkinManage-Plus/issues"

[project.optional-dependencies]
build = [
    "Nuitka==4.1.3",
    "packaging>=24.2",
    "pefile>=2023.2.7",
    "zstandard>=0.21.0",
]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.2",
    "pytest-asyncio>=0.21.0",
    "respx>=0.20.0",
    "ruff==0.17.2",
    "clang-format==18.1.8",
]

[tool.setuptools]
py-modules = ["run_app"]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = false

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["build", "dist", "data", "cache", "logs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "RUF100"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyside6"
asyncio_default_fixture_loop_scope = "function"
