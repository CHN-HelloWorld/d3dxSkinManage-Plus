name: 质量检查

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 安装依赖
        run: python -m pip install -e ".[dev]"
      - name: 检查代码、注释与文档
        run: |
          python -m ruff check .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m ruff format --check .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/quality/check_repository.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/i18n/i18n_catalog.py --check
          exit $LASTEXITCODE
      - name: 运行测试
        run: python -m pytest -q -o faulthandler_timeout=60

  updater:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: 构建更新器
        run: msbuild updater/updater.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:DeployUpdater=false /verbosity:minimal
      - name: 构建原生测试
        run: msbuild updater/tests/updater_tests.vcxproj /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
      - name: 运行原生测试
        run: updater/tests/bin/x64/Release/updater_tests.exe
